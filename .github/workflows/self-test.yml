name: self-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test single-file mode (existing behavior)
        id: trace-file
        uses: ./
        with:
          path: tests/fixtures/broken-sample.ts
          fail-on-detection: 'false'
          comment-on-pr: 'false'
          upload-sarif: 'false'

      - name: Assert single-file mode
        run: |
          if [ "${{ steps.trace-file.outputs.detection-count }}" -lt 6 ]; then
            echo "::error::single-file: expected >= 6, got ${{ steps.trace-file.outputs.detection-count }}"
            exit 1
          fi

      - name: Test directory mode (the bug we fixed)
        id: trace-dir
        uses: ./
        with:
          path: tests/fixtures-dir
          fail-on-detection: 'false'
          comment-on-pr: 'false'
          upload-sarif: 'false'

      - name: Assert directory mode
        run: |
          if [ "${{ steps.trace-dir.outputs.detection-count }}" -lt 7 ]; then
            echo "::error::directory: expected >= 7, got ${{ steps.trace-dir.outputs.detection-count }}"
            exit 1
          fi
          echo "Single-file: ${{ steps.trace-file.outputs.detection-count }}"
          echo "Directory: ${{ steps.trace-dir.outputs.detection-count }}"
