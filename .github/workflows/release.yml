name: release
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update major version tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          MAJOR=$(echo "$VERSION" | grep -oP '^v\d+')
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
