name: Trace (PR only)
on: pull_request

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: usercodeX-creator/trace-action@v1
        with:
          path: .
          upload-sarif: 'true'
          comment-on-pr: 'true'
